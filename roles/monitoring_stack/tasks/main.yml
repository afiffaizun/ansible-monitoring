---
- name: Create monitoring directory
  ansible.builtin.file:
    path: "{{ monitoring_dir }}"
    state: directory
    mode: "0755"

- name: Copy docker-compose.yml
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    mode: "0644"

- name: Copy Prometheus configuration
  ansible.builtin.copy:
    src: prometheus.yml
    dest: "{{ monitoring_dir }}/prometheus.yml"
    mode: "0644"

- name: Copy Loki configuration
  ansible.builtin.copy:
    src: loki-config.yml
    dest: "{{ monitoring_dir }}/loki-config.yml"
    mode: "0644"

- name: Copy Promtail configuration
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: "{{ monitoring_dir }}/promtail-config.yml"
    mode: "0644"

- name: Copy Grafana datasource provisioning
  ansible.builtin.copy:
    src: grafana-datasources.yml
    dest: "{{ monitoring_dir }}/grafana-datasources.yml"
    mode: "0644"

- name: Generate .env file for Docker Compose
  ansible.builtin.template:
    src: env.j2
    dest: "{{ monitoring_dir }}/.env"
    mode: "0600"

- name: Deploy monitoring stack with Docker Compose
  ansible.builtin.command: docker compose up -d --remove-orphans --force-recreate
  args:
    chdir: "{{ monitoring_dir }}"
  register: monitoring_stack_compose_result
  changed_when: monitoring_stack_compose_result.rc == 0

- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ monitoring_dir }}/provisioning/dashboards"
    - "{{ monitoring_dir }}/provisioning/dashboards/json"

- name: Copy Grafana dashboard provisioning config
  ansible.builtin.copy:
    dest: "{{ monitoring_dir }}/provisioning/dashboards/dashboards.yml"
    content: |
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: 'VPS Monitoring'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/provisioning/dashboards/json
            foldersFromFilesStructure: false
    mode: "0644"

- name: Copy Grafana dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ monitoring_dir }}/dashboard/{{ item | basename }}"
    mode: "0644"
  loop:
    - dashboard/vps-monitoring.json

- name: Wait for Grafana to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/health"
    method: GET
    return_content: true
  register: monitoring_stack_grafana_health
  until: monitoring_stack_grafana_health.status == 200
  retries: 30
  delay: 5

- name: Restart Grafana to reload dashboard provisioning
  ansible.builtin.command: docker restart grafana
  register: monitoring_stack_grafana_restart
  changed_when: monitoring_stack_grafana_restart.rc == 0

- name: Wait for Grafana to be ready after restart
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/health"
    method: GET
    return_content: true
  register: monitoring_stack_grafana_health_after
  until: monitoring_stack_grafana_health_after.status == 200
  retries: 30
  delay: 5
