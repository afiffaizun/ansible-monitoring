---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
      - python3-docker
    state: present

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Configure Docker log rotation to save disk
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    mode: "0644"
  notify: Restart Docker

- name: Ensure Docker is restarted if daemon.json changed
  ansible.builtin.meta: flush_handlers

- name: Check if Loki Docker plugin is installed
  ansible.builtin.command: docker plugin ls --format '{% raw %}{{ .Name }}{% endraw %}'
  register: docker_plugins
  changed_when: false

- name: Install Grafana Loki Docker Driver plugin
  ansible.builtin.command: >
    docker plugin install grafana/loki-docker-driver:latest
    --alias loki
    --grant-all-permissions
  register: plugin_install
  failed_when: plugin_install.rc != 0 and 'already exists' not in plugin_install.stderr
  changed_when: "'installed' in plugin_install.stderr"